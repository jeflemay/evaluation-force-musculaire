        const convertToNewtons = (value, fromUnit) => {
          if (!value) return null;
          const num = parseFloat(value);
          if (isNaN(num) || num <= 0) return null;
          return fromUnit === "kg" ? num * 9.81 : fromUnit === "lbs" ? num * 4.448 : num;
        };

        const convertFromNewtons = (value, toUnit) => {
          if (value == null) return null;
          return toUnit === "kg" ? value / 9.81 : toUnit === "lbs" ? value / 4.448 : value;
        };

        const convertWeightToKg = (weight, fromUnit) => {
          if (!weight) return null;
          const num = parseFloat(weight);
          if (isNaN(num)) return null;
          return fromUnit === "lbs" ? num * 0.453592 : num;
        };

        function App() {
          const [movement, setMovement] = useState("Rotation externe épaule");
          const [sex, setSex] = useState("H");
          const [ageRange, setAgeRange] = useState("20-29");
          const [side, setSide] = useState("DOM");
          const [forceType, setForceType] = useState("absolute");
          const [unit, setUnit] = useState("N");
          const [weightUnit, setWeightUnit] = useState("kg");
          const [bodyWeight, setBodyWeight] = useState("");
          const [measures, setMeasures] = useState(["", "", ""]);

          const handleMeasureChange = (i, v) => {
            const arr = [...measures];
            arr[i] = v;
            setMeasures(arr);
          };

          const validMeasures = measures.map(m => convertToNewtons(m, unit)).filter(m => m !== null);
          const mean = validMeasures.length > 0 ? validMeasures.reduce((a, b) => a + b, 0) / validMeasures.length : null;
          const bodyWeightKg = convertWeightToKg(bodyWeight, weightUnit);
          const bodyWeightN = bodyWeightKg ? bodyWeightKg * 9.81 : null;
          const relativeForce = mean && bodyWeightN ? (mean / bodyWeightN) * 100 : null;

          const coefficientOfVariation = validMeasures.length > 1 ? (() => {
            const sd = Math.sqrt(validMeasures.reduce((s, val) => s + Math.pow(val - mean, 2), 0) / validMeasures.length);
            return (sd / mean) * 100;
          })() : null;

          const norm = NORMS_OBJ[movement]?.[sex]?.[ageRange]?.[side];
          const currentNorm = norm?.[forceType];

          const valueToCompare = forceType === "absolute" ? mean : relativeForce;
          const percentDifference = valueToCompare && currentNorm ? ((valueToCompare - currentNorm.mean) / currentNorm.mean) * 100 : null;
          const displayUnit = forceType === "absolute" ? unit : "%";
          const displayValue = forceType === "absolute" ? (mean ? convertFromNewtons(mean, unit) : null) : relativeForce;

          const chartData = useMemo(() => {
            if (!currentNorm) return [];
            const isAbs = forceType === "absolute";
            const m = isAbs ? convertFromNewtons(currentNorm.mean, unit) : currentNorm.mean;
            const s = isAbs ? convertFromNewtons(currentNorm.sd, unit) : currentNorm.sd;
            const v = displayValue;

            const pdf = x => {
              const z = (x - m) / s;
              return (1 / (s * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * z * z);
            };

            const points = 150;
            const range = 4;
            let rawValues = [];

            for (let i = 0; i <= points; i++) {
              const x = m + range * s * (2 * i / points - 1);
              rawValues.push(x);
            }

            if (v != null) {
              rawValues.push(v);
              rawValues.push(v + 0.001); // Décalage infime pour un tracé vertical net
            }

            rawValues = Array.from(new Set(rawValues)).sort((a, b) => a - b);

            return rawValues.map(x => {
              const y = pdf(x);
              const inZone = v != null && x <= v;
              return {
                force: Math.round(x * 1000) / 1000,
                probabilite: y,
                zonePersonne: inZone ? y : 0
              };
            });
          }, [currentNorm, unit, displayValue, forceType]);

          return e('div', { className: "min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4" },

                ),

                  e('div', { className: "flex gap-4" },
                    e('label', { className: "flex items-center cursor-pointer" },
                      e('input', { type: "radio", value: "absolute", checked: forceType === "absolute", onChange: ev => setForceType(ev.target.value), className: "mr-2 w-4 h-4" }),
                      e('span', { className: "text-gray-700 font-medium" }, "Force absolue")
                    ),
                    e('label', { className: "flex items-center cursor-pointer" },
                      e('input', { type: "radio", value: "relative", checked: forceType === "relative", onChange: ev => setForceType(ev.target.value), className: "mr-2 w-4 h-4" }),
                      e('span', { className: "text-gray-700 font-medium" }, "Force relative (% poids corporel)")
                    )
                  )
                ),
                forceType === "relative" ? e('div', { className: "mb-6 bg-amber-50 rounded-lg p-4" },

                  ),

                    e('div', null,

                    ),

                      ["kg", "lbs"].map(u => e('label', { key: u, className: "flex items-center" },

                e('div', { className: "bg-gray-50 rounded-lg p-6 mb-8" },
                  e('h2', { className: "text-xl font-semibold text-gray-800 mb-4" }, "Mesures (1 à 3 répétitions)"),
                  e('div', { className: "mb-4" },
                    e('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, "Unité de mesure"),
                    e('div', { className: "flex gap-4" },
                      ["N", "kg", "lbs"].map(u => e('label', { key: u, className: "flex items-center" },
                        e('input', { type: "radio", value: u, checked: unit === u, onChange: ev => setUnit(ev.target.value), className: "mr-2" }),
                        e('span', { className: "text-gray-700" }, u)
                      ))
                    )
                  ),
                  e('div', { className: "grid md:grid-cols-3 gap-4" },
                    [0, 1, 2].map(i => e('div', { key: i },
                      e('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, `Mesure ${i + 1}`),
                      e('input', { type: "number", step: "0.1", value: measures[i], onChange: ev => handleMeasureChange(i, ev.target.value), placeholder: `Valeur en ${unit}`, className: "w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" })
                    ))
                  )
                ),
                (validMeasures.length > 0 && (forceType === "absolute" || bodyWeightN)) ? e(React.Fragment, null,
                  e('div', { className: "grid md:grid-cols-3 gap-6 mb-8" },
                    e('div', { className: "bg-indigo-50 rounded-lg p-6" },
                      e('div', { className: "flex items-center gap-2 mb-2" }, TrendingUpIcon(), e('h3', { className: "font-semibold text-gray-700" }, "Moyenne")),
                      e('p', { className: "text-3xl font-bold text-indigo-600" }, displayValue != null ? `${Number(displayValue).toFixed(1)} ${displayUnit}` : 'N/A')
                    ),
                    e('div', { className: `rounded-lg p-6 ${coefficientOfVariation > 10 ? 'bg-red-50' : 'bg-green-50'}` },
                      e('div', { className: "flex items-center gap-2 mb-2" }, AlertCircleIcon({ color: coefficientOfVariation > 10 ? 'text-red-600' : 'text-green-600' }), e('h3', { className: "font-semibold text-gray-700" }, "Coefficient de variation")),
                      e('p', { className: `text-3xl font-bold ${coefficientOfVariation > 10 ? 'text-red-600' : 'text-green-600'}` }, coefficientOfVariation != null ? `${coefficientOfVariation.toFixed(1)}%` : 'N/A'),
                      coefficientOfVariation > 10 ? e('p', { className: "text-sm text-red-600 mt-2" }, "⚠️ Variation élevée (>10%)") : null
                    ),
                    e('div', { className: `rounded-lg p-6 ${percentDifference < 0 ? 'bg-orange-50' : 'bg-blue-50'}` },
                      e('h3', { className: "font-semibold text-gray-700 mb-2" }, "Écart à la norme"),
                      e('p', { className: `text-3xl font-bold ${percentDifference < 0 ? 'text-orange-600' : 'text-blue-600'}` }, percentDifference != null ? `${percentDifference > 0 ? '+' : ''}${percentDifference.toFixed(1)}%` : 'N/A'),
                      currentNorm ? e('p', { className: "text-sm text-gray-600 mt-2" },
                        `Norme: ${(forceType === "absolute" ? convertFromNewtons(currentNorm.mean, unit) : currentNorm.mean).toFixed(1)} ${displayUnit} (±${(forceType === "absolute" ? convertFromNewtons(currentNorm.sd, unit) : currentNorm.sd).toFixed(1)})`
                      ) : null
                    )
                  ),
                  e('div', { className: "bg-gray-50 rounded-lg p-6" },
                    e('h2', { className: "text-xl font-semibold text-gray-800 mb-4" }, "Distribution normale et positionnement"),
                    e(ResponsiveContainer, { width: "100%", height: 400 },
                      e(ComposedChart, { data: chartData },
                        e(CartesianGrid, { strokeDasharray: "3 3" }),
                        e(XAxis, { 
                          dataKey: "force", 
                          type: "number", 
                          domain: ['auto', 'auto'],
                          tickFormatter: v => Number(v).toFixed(1),
                          label: { value: `Force (${displayUnit})`, position: "insideBottom", offset: -5 } 
                        }),
                        e(YAxis, { label: { value: "Densité", angle: -90, position: "insideLeft" } }),
                        e(Tooltip, null),
                        e(Legend, null),
                        displayValue != null ? e(Area, { type: "linear", dataKey: "zonePersonne", fill: "#fca5a5", fillOpacity: 0.4, stroke: "#dc2626", strokeWidth: 2, name: "Votre zone" }) : null,
                        e(Line, { type: "monotone", dataKey: "probabilite", stroke: "#4f46e5", strokeWidth: 2, dot: false, name: "Normale" }),
                        currentNorm ? e(ReferenceLine, { x: forceType === "absolute" ? convertFromNewtons(currentNorm.mean, unit) : currentNorm.mean, stroke: "#10b981", strokeWidth: 2, strokeDasharray: "5 5", label: { value: "Norme", position: "top", fill: "#10b981" } }) : null,
                        displayValue != null ? e(ReferenceLine, { x: displayValue, stroke: "#dc2626", strokeWidth: 4, label: { value: "Vous", position: "top", fill: "#dc2626", fontSize: 14 } }) : null
                      )
                    )
                  )
                ) : null,
                (validMeasures.length > 0 && forceType === "relative" && !bodyWeightN) ? e('div', { className: "bg-amber-50 border-2 border-amber-300 rounded-lg p-6 text-center" },
                  AlertCircleIcon({ color: "text-amber-600" }),
                  e('p', { className: "text-lg font-semibold text-amber-800 mt-3" }, "Entrez le poids corporel pour la force relative")
                ) : null
              )
            )
          );
        }

        ReactDOM.render(e(App), document.getElementById('root'));
      });
    });
  </script>
